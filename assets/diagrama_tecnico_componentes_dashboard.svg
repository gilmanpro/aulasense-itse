<text xml:space="preserve" text-anchor="start" x="99.75" y="-801.3" font-family="Arial" font-size="34.00" fill="#444444">Auth (F25&#45;e, D&#45;F25&#45;8)</text>
<text xml:space="preserve" text-anchor="start" x="142.12" y="-781.55" font-family="Arial" font-size="19.00" fill="#444444">[Component: Argon2id scrypt]</text>
<text xml:space="preserve" text-anchor="start" x="87.38" y="-743.8" font-family="Arial" font-size="24.00" fill="#444444">Admin unico; password generada</text>
<text xml:space="preserve" text-anchor="start" x="210.38" y="-719.8" font-family="Arial" font-size="24.00" fill="#444444">por codigo</text>
<text xml:space="preserve" text-anchor="start" x="138.75" y="-695.8" font-family="Arial" font-size="24.00" fill="#444444">(secrets.token_hex(16))</text>
<text xml:space="preserve" text-anchor="start" x="135" y="-671.8" font-family="Arial" font-size="24.00" fill="#444444">guardada en claves/.env</text>
<text xml:space="preserve" text-anchor="start" x="106.88" y="-647.8" font-family="Arial" font-size="24.00" fill="#444444">(gitignored, NUNCA impresa);</text>
<text xml:space="preserve" text-anchor="start" x="122.62" y="-623.8" font-family="Arial" font-size="24.00" fill="#444444">hash Argon2id con fallback</text>
<text xml:space="preserve" text-anchor="start" x="105.75" y="-599.8" font-family="Arial" font-size="24.00" fill="#444444">scrypt autodescriptivo. Cookie</text>
<text xml:space="preserve" text-anchor="start" x="86.62" y="-575.8" font-family="Arial" font-size="24.00" fill="#444444">HttpOnly + SameSite=Lax (en BD</text>
<text xml:space="preserve" text-anchor="start" x="132.75" y="-551.8" font-family="Arial" font-size="24.00" fill="#444444">solo SHA&#45;256 del token);</text>
<text xml:space="preserve" text-anchor="start" x="125.25" y="-527.8" font-family="Arial" font-size="24.00" fill="#444444">expiracion absoluta 12 h +</text>
<text xml:space="preserve" text-anchor="start" x="157.88" y="-503.8" font-family="Arial" font-size="24.00" fill="#444444">idle 2 h. Lockout por</text>
<text xml:space="preserve" text-anchor="start" x="106.5" y="-479.8" font-family="Arial" font-size="24.00" fill="#444444">IP+usuario: 5/10/20 fallos dan</text>
<text xml:space="preserve" text-anchor="start" x="132.38" y="-455.8" font-family="Arial" font-size="24.00" fill="#444444">60 s / 15 min / 1 h (429 +</text>
<text xml:space="preserve" text-anchor="start" x="103.5" y="-431.8" font-family="Arial" font-size="24.00" fill="#444444">Retry&#45;After). Middleware exige</text>
<text xml:space="preserve" text-anchor="start" x="122.25" y="-407.8" font-family="Arial" font-size="24.00" fill="#444444">sesion en TODAS las rutas</text>
<text xml:space="preserve" text-anchor="start" x="160.12" y="-383.8" font-family="Arial" font-size="24.00" fill="#444444">salvo /login, /logout,</text>
<text xml:space="preserve" text-anchor="start" x="155.62" y="-359.8" font-family="Arial" font-size="24.00" fill="#444444">estaticos y /internal/*</text>
<text xml:space="preserve" text-anchor="start" x="109.88" y="-335.8" font-family="Arial" font-size="24.00" fill="#444444">(Origin guard). WS /ws valida</text>
<text xml:space="preserve" text-anchor="start" x="136.5" y="-311.8" font-family="Arial" font-size="24.00" fill="#444444">cookie en el handshake.</text>
</g>
