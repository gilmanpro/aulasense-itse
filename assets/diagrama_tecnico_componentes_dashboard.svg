<text xml:space="preserve" text-anchor="start" x="2200.38" y="-539.8" font-family="Arial" font-size="24.00" fill="#444444">+ no&#45;store, 404 si purgada).</text>
<text xml:space="preserve" text-anchor="start" x="2193.62" y="-515.8" font-family="Arial" font-size="24.00" fill="#444444">El dashboard NUNCA acepta</text>
<text xml:space="preserve" text-anchor="start" x="2188" y="-491.8" font-family="Arial" font-size="24.00" fill="#444444">uploads. Retencion 30 dias: la</text>
<text xml:space="preserve" text-anchor="start" x="2177.88" y="-467.8" font-family="Arial" font-size="24.00" fill="#444444">purga marca imagen_purgada y</text>
<text xml:space="preserve" text-anchor="start" x="2205.62" y="-443.8" font-family="Arial" font-size="24.00" fill="#444444">CONSERVA la fila (dataset</text>
<text xml:space="preserve" text-anchor="start" x="2306.88" y="-419.8" font-family="Arial" font-size="24.00" fill="#444444">intacto).</text>
