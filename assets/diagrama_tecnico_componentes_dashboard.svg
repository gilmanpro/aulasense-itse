<text xml:space="preserve" text-anchor="start" x="628.38" y="-592.8" font-family="Arial" font-size="24.00" fill="#444444">(matriz de confusion),</text>
<text xml:space="preserve" text-anchor="start" x="577" y="-568.8" font-family="Arial" font-size="24.00" fill="#444444">/fuentes_externas, /export CSV</text>
<text xml:space="preserve" text-anchor="start" x="652.38" y="-544.8" font-family="Arial" font-size="24.00" fill="#444444">(real por default),</text>
<text xml:space="preserve" text-anchor="start" x="632.5" y="-520.8" font-family="Arial" font-size="24.00" fill="#444444">/internal/evento (solo</text>
