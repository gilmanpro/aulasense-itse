<text xml:space="preserve" text-anchor="start" x="1181.75" y="-883.3" font-family="Arial" font-size="34.00" fill="#444444">Salud del sistema</text>
<text xml:space="preserve" text-anchor="start" x="1203.5" y="-849.3" font-family="Arial" font-size="34.00" fill="#444444">(F26, D&#45;F26&#45;8)</text>
<text xml:space="preserve" text-anchor="start" x="1223" y="-829.55" font-family="Arial" font-size="19.00" fill="#444444">[Component: FastAPI]</text>
<text xml:space="preserve" text-anchor="start" x="1173.5" y="-791.8" font-family="Arial" font-size="24.00" fill="#444444">GET /api/salud tras login +</text>
<text xml:space="preserve" text-anchor="start" x="1164.5" y="-767.8" font-family="Arial" font-size="24.00" fill="#444444">panel /salud con semaforos:</text>
<text xml:space="preserve" text-anchor="start" x="1149.88" y="-743.8" font-family="Arial" font-size="24.00" fill="#444444">ingesta activa (estado_sistema</text>
<text xml:space="preserve" text-anchor="start" x="1178.38" y="-719.8" font-family="Arial" font-size="24.00" fill="#444444">fresco hasta 90 s), MQTT</text>
<text xml:space="preserve" text-anchor="start" x="1152.88" y="-695.8" font-family="Arial" font-size="24.00" fill="#444444">conectado, frescura telemetria</text>
<text xml:space="preserve" text-anchor="start" x="1137.12" y="-671.8" font-family="Arial" font-size="24.00" fill="#444444">(hasta 5 min), heap INTERNO de</text>
<text xml:space="preserve" text-anchor="start" x="1157.38" y="-647.8" font-family="Arial" font-size="24.00" fill="#444444">la placa (hasta 120 KB warn),</text>
<text xml:space="preserve" text-anchor="start" x="1164.5" y="-623.8" font-family="Arial" font-size="24.00" fill="#444444">RSSI, colas vision+decision,</text>
<text xml:space="preserve" text-anchor="start" x="1247.38" y="-599.8" font-family="Arial" font-size="24.00" fill="#444444">consumo dia</text>
<text xml:space="preserve" text-anchor="start" x="1167.5" y="-575.8" font-family="Arial" font-size="24.00" fill="#444444">(vision_uso/clef_uso), disco</text>
<text xml:space="preserve" text-anchor="start" x="1196" y="-551.8" font-family="Arial" font-size="24.00" fill="#444444">(hasta 85 pct), tuneles</text>
<text xml:space="preserve" text-anchor="start" x="1167.88" y="-527.8" font-family="Arial" font-size="24.00" fill="#444444">(datos/tuneles_estado.json,</text>
<text xml:space="preserve" text-anchor="start" x="1154.75" y="-503.8" font-family="Arial" font-size="24.00" fill="#444444">SOLO state/remote) y OTA en</text>
<text xml:space="preserve" text-anchor="start" x="1145.75" y="-479.8" font-family="Arial" font-size="24.00" fill="#444444">curso (informativo: SUPRIME la</text>
<text xml:space="preserve" text-anchor="start" x="1160.75" y="-455.8" font-family="Arial" font-size="24.00" fill="#444444">alarma de frescura porque el</text>
<text xml:space="preserve" text-anchor="start" x="1158.5" y="-431.8" font-family="Arial" font-size="24.00" fill="#444444">agujero es esperado). Tarjeta</text>
<text xml:space="preserve" text-anchor="start" x="1165.62" y="-407.8" font-family="Arial" font-size="24.00" fill="#444444">camara/gate desde el retain</text>
<text xml:space="preserve" text-anchor="start" x="1137.88" y="-383.8" font-family="Arial" font-size="24.00" fill="#444444">imagen_estado + config_eventos</text>
<text xml:space="preserve" text-anchor="start" x="1042.62" y="-359.8" font-family="Arial" font-size="24.00" fill="#444444">(GATE_OFF/DESCARTE/INIT/CAMARA_ERROR).</text>
<text xml:space="preserve" text-anchor="start" x="1205" y="-335.8" font-family="Arial" font-size="24.00" fill="#444444">Cero secretos en las</text>
<text xml:space="preserve" text-anchor="start" x="1253.38" y="-311.8" font-family="Arial" font-size="24.00" fill="#444444">respuestas.</text>
</g>
