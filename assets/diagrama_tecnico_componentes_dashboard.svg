<text xml:space="preserve" text-anchor="start" x="1725.38" y="-722.3" font-family="Arial" font-size="34.00" fill="#444444">WS /ws push en vivo</text>
<text xml:space="preserve" text-anchor="start" x="1776.38" y="-702.55" font-family="Arial" font-size="19.00" fill="#444444">[Component: WebSocket]</text>
<text xml:space="preserve" text-anchor="start" x="1742.62" y="-664.8" font-family="Arial" font-size="24.00" fill="#444444">Polling de las filas escritas</text>
<text xml:space="preserve" text-anchor="start" x="1760.62" y="-640.8" font-family="Arial" font-size="24.00" fill="#444444">por la ingesta (proceso</text>
<text xml:space="preserve" text-anchor="start" x="1763.25" y="-616.8" font-family="Arial" font-size="24.00" fill="#444444">aparte) cada 400 ms y</text>
<text xml:space="preserve" text-anchor="start" x="1753.5" y="-592.8" font-family="Arial" font-size="24.00" fill="#444444">broadcast a clientes con</text>
<text xml:space="preserve" text-anchor="start" x="1736.25" y="-568.8" font-family="Arial" font-size="24.00" fill="#444444">sesion. Latencia E2E REAL</text>
<text xml:space="preserve" text-anchor="start" x="1735.88" y="-544.8" font-family="Arial" font-size="24.00" fill="#444444">medida en F3: broker a WS</text>
<text xml:space="preserve" text-anchor="start" x="1719.38" y="-520.8" font-family="Arial" font-size="24.00" fill="#444444">entre 14 ms (buen caso) y 361</text>
<text xml:space="preserve" text-anchor="start" x="1742.25" y="-496.8" font-family="Arial" font-size="24.00" fill="#444444">ms (peor caso), dentro del</text>
<text xml:space="preserve" text-anchor="start" x="1751.25" y="-472.8" font-family="Arial" font-size="24.00" fill="#444444">criterio de menos de 2 s.</text>
</g>
